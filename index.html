<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fired Up</title>
<meta name="fu-ver" content="31">
<meta name="theme-color" content="#F5F6F8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fired Up">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
<style>
/* Дизайн 2 „Светъл и чист“: бял фон, бели карти със сянка, зелено за печалба и червено за загуба (Manrope). */
:root{
  --pwa-offset:92px;
  --bg:#F5F6F8; --surface:#FFFFFF; --raise:#F0F1F4; --line:#E5E7EB; --line2:#EEF0F3; --ink:#0E1116; --muted:#6B7280; --dim:#9CA3AF;
  --accent:#0E1116; --accent-ink:#FFFFFF; --up:#00A35C; --down:#E5484D; --cyan:#2F5BEA; --gold:#D99A00; --silver:#8A93A6; --bronze:#D9772B;
  --display:"Manrope",system-ui,-apple-system,sans-serif; --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;left:-140px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(0,163,92,.12),rgba(245,246,248,0) 65%);pointer-events:none;z-index:-1}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.d{font-family:var(--display);font-weight:800}
.num{font-variant-numeric:tabular-nums}
/* горна лента */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(245,246,248,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-style:italic;font-size:15px}
.logo svg{width:24px;height:24px;transform-origin:50% 90%;animation:flick 1.5s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}35%{transform:scale(1.07,.93) rotate(3deg)}65%{transform:scale(.95,1.07) rotate(-1deg)}}
.clockp{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 4px}
.clockp svg{width:26px;height:26px}
.clockp b{display:block;font-family:var(--display);font-weight:800;font-size:10px;line-height:1.1;color:var(--muted)}
.clockp.live b{color:var(--accent)}
.clockp span{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.1}
.icb{position:relative;width:44px;height:44px;border:0;border-radius:14px;background:var(--raise);display:grid;place-items:center}
.icb svg{width:20px;height:20px}
.icb .n{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--down);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tape{overflow:hidden;height:30px;position:relative;background:#FFFFFF;border-block:1px solid #E5E7EB}
.tape .run{display:flex;gap:22px;white-space:nowrap;position:absolute;left:0;top:0;height:30px;align-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;animation:tape linear infinite;will-change:transform}
@keyframes tape{to{transform:translateX(-50%)}}
main .wrap{display:flex;flex-direction:column;padding-block:14px calc(112px + env(safe-area-inset-bottom,0px))}
/* портфейл */
.port{display:flex;flex-direction:column;gap:4px}
.port .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.port .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.port .val{font-family:var(--display);font-weight:800;font-size:clamp(28px,9vw,36px);letter-spacing:-.03em;line-height:1.15}
.port .chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--display);font-weight:800;font-size:12.5px;color:var(--bg);background:var(--up);border-radius:7px;padding:3px 8px}
.pill.neg{background:var(--down)}
.seg{display:inline-flex;background:var(--raise);border-radius:11px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 11px;border:0;border-radius:8px;font-size:12px;font-weight:800;background:none;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.big{display:flex}.seg.big button{flex:1;height:38px;font-size:13px}
.chart{width:100%;display:block;touch-action:pan-y}
.tfs{display:flex;gap:4px;margin-top:8px}
.tfs button{flex:1;height:36px;border:0;border-radius:10px;font-family:var(--display);font-size:11px;font-weight:800;background:var(--raise);color:var(--muted)}
.tfs button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:12px}
.h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.h b{font-family:var(--display);font-weight:800;font-size:14px}
.h a,.h button.lnk{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;background:none;border:0;padding:0}
.h span{font-size:12px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:4px 12px}
.ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.ev:last-child{border-bottom:0}
.ev .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:10px;color:var(--bg)}
.ev .x{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev time{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ev.fresh{animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
.feedfull .ev .x{white-space:normal}
.mvp{margin-top:16px;border-radius:22px;padding:1.5px;background:linear-gradient(120deg,var(--accent),var(--cyan));border:0;text-align:left;width:100%;display:block}
.mvp>span{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:21px;padding:12px 14px}
.av{width:38px;height:38px;border-radius:12px;background:var(--c);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:11px;flex:none}
.mvp .av{width:50px;height:50px;border-radius:16px;font-size:16px;transform:rotate(-4deg)}
.mvp .t{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.mvp small{font-family:var(--display);font-weight:800;font-size:9.5px;letter-spacing:.14em;color:var(--accent)}
.mvp b{font-size:15px}
.mvp i{font-style:normal;font-size:12px;color:var(--muted)}
.filt{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filt button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:800;background:none;color:var(--muted);white-space:nowrap}
.filt button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rows{display:flex;flex-direction:column;gap:6px}
.tctl{display:flex;gap:6px;margin-bottom:10px}
.tctl input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:14px}
.tctl select{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 8px;font:inherit;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile2{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px 10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;width:100%;cursor:pointer;overflow:hidden;min-width:0}
.tile2.edge{border-color:rgba(229,72,77,.55);background:rgba(229,72,77,.07)}
.tile2.trade{border-color:rgba(47,91,234,.45)}
.tile2 canvas{width:100%;height:46px;display:block;margin-bottom:2px}
.tile2 .nm{display:flex;align-items:center;gap:6px;min-width:0}
.tile2 .nm i{font-style:normal;font-family:var(--display);font-weight:900;font-size:11px;color:var(--dim);flex:none}
.tile2 .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile2 .dot2{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.tile2 .val{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.tile2 .pl2{font-size:12px;font-weight:800}
.tile2 .st{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile2 .star{position:absolute;top:2px;right:2px;width:36px;height:36px}
.more{width:100%;height:44px;margin-top:10px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-weight:800}
.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.row.edge{background:rgba(229,72,77,.08);border-color:rgba(229,72,77,.5);animation:alarm 1.6s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 18px rgba(229,72,77,.25)}}
.row .main{display:grid;grid-template-columns:22px 38px minmax(0,1fr) 46px auto;align-items:center;gap:9px;padding:10px 0 12px 10px;border:0;background:none;text-align:left;min-width:0}
.row .rk{font-family:var(--display);font-weight:900;font-size:15px;color:var(--dim);text-align:center}
.row .who{display:flex;flex-direction:column;gap:1px;min-width:0}
.row .who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row canvas{width:46px;height:24px}
.row .pl{display:flex;flex-direction:column;align-items:flex-end}
.row .pl b{font-size:13.5px;font-weight:700}
.row .pl span{font-family:var(--display);font-weight:800;font-size:11px;white-space:nowrap}
.star{width:44px;height:44px;border:0;background:none;color:var(--dim);display:grid;place-items:center}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"]{color:var(--gold)}
.star[aria-pressed="true"] svg{fill:var(--gold)}
.row .bar{position:absolute;bottom:0;height:3px;border-radius:2px}
.row.fl-up{animation:flUp .9s ease-out}.row.fl-down{animation:flDn .9s ease-out}
@keyframes flUp{0%{background:rgba(0,163,92,.22)}}
@keyframes flDn{0%{background:rgba(229,72,77,.22)}}
.empty{color:var(--muted);text-align:center;padding:24px 12px;font-size:13.5px}
.setup{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.note{font-size:12px;color:var(--muted);line-height:1.55;margin:14px 4px 0}
.upd{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:14px}
/* статистика */
.card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px}
.strat{width:100%;text-align:left;cursor:pointer}
.strat .tg{font-size:12px;color:#4B5563;margin-top:1px}
.strat .go{font-size:11.5px;font-weight:700;color:var(--cyan);margin-top:3px}
.hero2{border-radius:22px;padding:16px;background:linear-gradient(140deg,rgba(0,163,92,.14),rgba(47,91,234,.08));border:1px solid rgba(0,163,92,.35);margin-top:12px}
.hero2 small{font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.14em;color:var(--accent)}
.hero2 p{margin:6px 0 0;font-size:16px;font-weight:600;line-height:1.45}
.howl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.howl li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14.5px;line-height:1.45;counter-increment:st}
.howl li::before{content:counter(st);width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:12px}
.warn{border-radius:18px;padding:12px 14px;background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.4);font-size:14px;line-height:1.45}
.warn b{display:block;font-family:var(--display);font-size:10.5px;letter-spacing:.12em;color:var(--down);margin-bottom:4px}
.strat{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center}
.strat b{font-size:14.5px}
.strat .s{font-size:12px;color:var(--muted)}
.strat .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.grave{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.grave .stamp{position:absolute;right:12px;top:10px;font-family:var(--display);font-weight:900;font-size:10px;letter-spacing:.1em;color:var(--down);border:2px solid var(--down);border-radius:6px;padding:2px 7px;transform:rotate(7deg)}
.grave .av{background:#D1D5DB;color:var(--muted)}
.grave .nm{font-size:14.5px;font-weight:800;text-decoration:line-through;text-decoration-color:var(--down)}
details.grave summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:6px}
details.grave summary::-webkit-details-marker{display:none}
details.grave .more{font-size:11.5px;color:var(--cyan);font-weight:700}
details.grave[open] .more{display:none}
details.grave .desc{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.recs .card{min-height:104px;display:flex;flex-direction:column;gap:4px}
.recs .v{font-family:var(--display);font-weight:800;font-size:19px}
.list{display:flex;flex-direction:column;gap:8px}
.real{margin-top:14px}
.real ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
/* таб лента */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;height:62px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
nav.tabs button{position:relative;height:46px;min-width:46px;border:0;border-radius:16px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:12.5px;font-weight:800;transition:background .3s,color .3s}
nav.tabs button svg{width:21px;height:21px;flex:none}
nav.tabs button .t{display:none}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--bg)}
nav.tabs button[aria-selected="true"] .t{display:inline}
nav.tabs .badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--down);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 4px}
/* цели страници: трейдър и сделка */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:pin .38s cubic-bezier(.2,1,.3,1);padding-top:env(safe-area-inset-top,0px)}
@keyframes pin{from{transform:translateX(100%)}}
.page .wrap{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;align-items:center;gap:10px;padding:12px 0 4px}
.back{width:44px;height:44px;border:0;border-radius:14px;background:var(--raise);display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.glowtop{position:absolute;left:0;right:0;top:0;height:300px;pointer-events:none;background:linear-gradient(180deg,var(--gl),rgba(245,246,248,0))}
.pav{width:52px;height:52px;border-radius:17px;font-size:19px;transform:rotate(-5deg);box-shadow:0 10px 30px var(--glc)}
.pt{display:flex;flex-direction:column;flex:1;min-width:0}
.pt b{font-family:var(--display);font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt span{font-size:12px;color:#4B5563}
.cap{display:flex;align-items:flex-end;justify-content:space-between;padding-top:14px}
.cap .l{display:flex;flex-direction:column;gap:3px}
.cap .l small{font-size:12.5px;font-weight:700;color:#4B5563}
.cap .l b{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em}
.cap .l i{font-style:normal;font-family:var(--display);font-weight:800;font-size:12px}
.lives{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lives small{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#4B5563}
.lives span{display:flex;gap:4px}
.lives svg{width:20px;height:18px}
.legend{margin-left:auto;font-size:11.5px;color:var(--muted)}
.posc{margin-top:14px;border-radius:22px;padding:12px 14px;background:linear-gradient(120deg,rgba(47,91,234,.16),rgba(0,163,92,.08));border:1px solid rgba(47,91,234,.45);display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.posc .r1{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 6px rgba(47,91,234,.2);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(47,91,234,0)}}
.posc .t{display:flex;flex-direction:column;flex:1;min-width:0}
.posc .t b{font-size:14.5px}
.posc .t span{font-size:12px;color:var(--muted)}
.posc .r{display:flex;flex-direction:column;align-items:flex-end}
.meter{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down) 0%,#D1D5DB 33%,#D1D5DB 55%,var(--accent) 100%)}
.meter i{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);border:3px solid var(--ink);transition:left .6s}
.meter.big{height:12px;border-radius:6px}.meter.big i{top:-6px;width:24px;height:24px;margin-left:-12px;border-width:4px}
.ml{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;font-weight:700}
.pend{margin-top:14px;border:1px dashed rgba(47,91,234,.6);background:rgba(47,91,234,.06);border-radius:16px;padding:10px 14px;font-size:13px}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:left}
.bs{display:flex;align-items:center;gap:3px}
.bs i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:900;font-size:10px;color:var(--bg)}

.tr .m{display:flex;flex-direction:column;min-width:0}
.tr .m b{font-size:14px}
.tr .m b small{font-weight:600;color:var(--muted);font-size:12px}
.tr .m span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .r{display:flex;flex-direction:column;align-items:flex-end}
.tr .r b{font-family:var(--display);font-weight:800;font-size:12.5px}
.tr .r span{font-size:12px;font-weight:700}
.rule{display:flex;gap:10px;font-size:14px;line-height:1.45}

.chips{display:flex;gap:8px;flex-wrap:wrap}

.rk2{display:flex;flex-direction:column;gap:6px}
.rk2 .a{display:flex;justify-content:space-between;font-size:13.5px}
.rk2 .b{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.rk2 .b i{display:block;height:100%;border-radius:4px}
.livep{margin-left:auto;font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.1em;color:var(--bg);background:var(--cyan);border-radius:6px;padding:5px 8px}
.livep.closed{background:var(--line);color:var(--ink)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding-bottom:14px}
.step i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:900;font-size:11px;color:var(--bg)}
.step b{display:block;font-size:14px}
.step span{font-size:12.5px;color:var(--muted);line-height:1.4}
.step time{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:3px}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles3 .tile .v{font-size:13px}
.ctool{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
/* известия */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,3,8,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet .bx{width:100%;max-width:560px;max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:upS .4s cubic-bezier(.2,1.1,.3,1)}
@keyframes upS{from{transform:translateY(100%)}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}

.boom{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;cursor:pointer;background:radial-gradient(circle at 50% 40%,rgba(229,72,77,.45),rgba(245,246,248,.96) 62%);animation:redflash .5s steps(2) 2}
@keyframes redflash{50%{background:rgba(229,72,77,.6)}}
.boom .card2{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.boom .victim{display:flex;flex-direction:column;align-items:center;gap:8px;animation:fall .9s cubic-bezier(.5,0,.8,.4) 1.5s both}

@keyframes slam{from{transform:rotate(-9deg) scale(3.2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}

@keyframes slideIn{from{opacity:0;transform:translateY(30px) scale(.9)}}

/* интро */
.intro{position:fixed;inset:0;z-index:100;background:#F5F6F8;display:grid;place-items:center;overflow:hidden;cursor:pointer;clip-path:circle(150% at 50% 45%)}
.intro .glow{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:radial-gradient(circle,rgba(0,163,92,.35),rgba(47,91,234,.12) 30%,transparent 60%);animation:burst 1.4s cubic-bezier(.2,.8,.2,1) .25s forwards}

.intro .stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}

@keyframes ignite{0%{transform:scale(0) translateY(30px)}100%{transform:scale(1)}}
.intro h1{margin:0;font-family:var(--display);font-weight:900;font-style:italic;font-size:clamp(46px,15vw,84px);line-height:.95;letter-spacing:-.04em;display:flex;gap:.2em}
.intro h1 span{display:inline-block;background:linear-gradient(180deg,#fff,var(--accent) 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}

.intro h1 .b{animation:inR .55s cubic-bezier(.2,1.4,.4,1) .75s forwards}
@keyframes inL{from{opacity:0;transform:translateX(-60vw) skewX(-25deg)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(60vw) skewX(25deg)}to{opacity:1;transform:none}}
.intro .pv{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:16px;opacity:0;animation:fadeUp .5s 1.1s forwards}
.intro .pv small{font-size:12.5px;font-weight:700;color:var(--muted)}
.intro .pv b{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em}
.intro .sub{font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fadeUp .5s 1.3s forwards;text-align:center;padding:0 20px;margin-top:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro .load{width:160px;height:4px;border-radius:2px;background:rgba(14,17,22,.1);overflow:hidden;margin-top:10px;opacity:0;animation:fadeUp .4s 1.3s forwards}
.intro .load i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--cyan));animation:fillx 1.1s ease-in-out 1.3s forwards}
@keyframes fillx{to{width:100%}}
.intro .sparks i{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px var(--accent);opacity:0;animation:sp 1s cubic-bezier(.1,.8,.3,1) .55s forwards}
@keyframes sp{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.4)}}
.intro.out{animation:wipe .7s cubic-bezier(.7,0,.2,1) forwards}
@keyframes wipe{to{clip-path:circle(0% at 50% 45%);opacity:.6}}
.stagger>*{animation:enter .55s cubic-bezier(.2,.9,.3,1.1) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(n+6){animation-delay:.25s}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style>

 stoch_cross:{"tag": "Продавачите се изморяват", "idea": "„Продавачите се изморяват“ значи следното: акцията пада известно време, защото повече хора продават, отколкото купуват. Но продавачите не са безкрайни — в един момент почти всички, които искат да продадат, вече са продали. Тогава спадът спира и цената тръгва обратно нагоре. Ботът мери с индикатор (Стохастик) дали цената е близо до най-ниското за последните минути, и купува в момента, в който тя започне да се обръща нагоре.", "ex": "Акцията пада от $3,00 до $2,70 за 20 минути и е съвсем близо до най-ниското. После две минути подред цената се качва — индикаторът се обръща нагоре и ботът купува на $2,73.", "how": ["Мери къде е цената спрямо най-високото и най-ниското за последните 14 минути (0 = на дъното, 100 = на върха).", "Чака стойността да е много ниска — под 20–25 (цената е почти на дъното).", "Купува, когато стойността започне да се качва — значи спадът спира."], "fail": "Продавачите не са свършили — след кратка пауза цената продължава да пада."},

 macd_cross:{"tag": "Спадът губи сила", "idea": "Ботът следи с индикатор (MACD) дали цената пада все по-бавно. Когато спадът изгуби сила и движението се обърне нагоре, купува — хваща момента, в който падането свършва и започва възстановяване.", "ex": "Акцията пада от $2,00 до $1,80, но последните минути пада все по-малко. Индикаторът се обръща нагоре на $1,82 — ботът купува.", "how": ["Сравнява как се е движила цената в последните ~12 минути с последните ~26 минути.", "Изчаква период, в който акцията е падала.", "Купува, когато падането спре и движението се обърне нагоре."], "fail": "Обръщането е кратко и цената пак тръгва надолу."},

  const nb=D&&D.bots.slice().sort((a,b)=>b.hiredAt-a.hiredAt).find(b=>b.hiredAt>=f.firedAt);const el=$('#boom');el.hidden=false;
  el.innerHTML=`<div class="card2"><div class="victim"><span class="av" style="--c:${f.color}">${esc(initials(f.name))}</span><div class="nm">${esc(f.name)}</div></div><div class="big">УВОЛНЕН!</div><div class="why">${esc(f.style)}${f.why?' · '+esc(f.why):''} · ${money0(f.pnl,true)} общо</div>${nb?`<div class="next"><span class="av" style="--c:${nb.color}">${esc(initials(nb.name))}</span><div><small>НОВ ИГРАЧ</small><b>${esc(nb.name)}</b><br><span style="font-size:12.5px;color:var(--muted)">${esc(nb.style)}</span></div></div>`:''}<div class="tap">Докосни, за да продължиш</div></div>`;
  if(navigator.vibrate)try{navigator.vibrate([60,40,120])}catch(e){}clearTimeout(el._t);el._t=setTimeout(nextBoom,5200)}
$('#boom').onclick=()=>{clearTimeout($('#boom')._t);nextBoom()};

/* ——— събития ——— */
function setTab(t){tab=t;LS.set('fu-tab',tab);homeDrawn=false;if(D)render();scrollTo({top:0,behavior:reduce?'auto':'smooth'})}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.v)};
document.addEventListener('click',e=>{const t=e.target;
  const star=t.closest('[data-star]');if(star){const id=star.dataset.star;favs.has(id)?favs.delete(id):favs.add(id);LS.set('fu-favs',JSON.stringify([...favs]));if(pushSub)pushSave().catch(()=>{});star.setAttribute('aria-pressed',favs.has(id));if(filt==='fav'&&D)rows(D);if(D)bell(D);return}
  const op=t.closest('[data-open]');if(op){openTrader(op.dataset.open);return}
  if(t.closest('#mvp')){openTrader($('#mvp').dataset.id);return}
  const go=t.closest('[data-go]');if(go){setTab(go.dataset.go);return}
  const bb=t.closest('#basis button');if(bb){basis=bb.dataset.b;LS.set('fu-basis',basis);if(D)home(D);return}
  const tf=t.closest('#htf button');if(tf){hTf=tf.dataset.tf;LS.set('fu-htf',hTf);homeDrawn=false;if(D)home(D);return}
  const fb=t.closest('#filt button');if(fb){filt=fb.dataset.f;LS.set('fu-filt',filt);shown=24;if(D)rows(D);return}
  if(t.closest('#moreBtn')){shown+=24;if(D)rows(D);return}
  const fs=t.closest('#fSort button');if(fs){fSort=fs.dataset.fs;if(D)firedV(D);return}
  const sb=t.closest('#stab button');if(sb){statsTab=sb.dataset.s;if(D)render();return}
  const cl=t.closest('[data-close]');if(cl){history.back();return}
  const ttf=t.closest('[data-ttf]');if(ttf){tTf=ttf.dataset.ttf;traderPage(true);return}
  const ttab=t.closest('[data-ttab]');if(ttab){tTab=ttab.dataset.ttab;traderPage(true);return}
  const sk=t.closest('[data-strat]');if(sk){openStrat(sk.dataset.strat);return}
  const tr=t.closest('[data-trade]');if(tr){const v=tr.dataset.trade;openTrade(v.startsWith('pos:')?{bot:traderId,kind:'pos',sym:v.slice(4)}:{bot:traderId,kind:'trade',i:+v.slice(2)});return}
  const cm=t.closest('[data-cmode]');if(cm){cMode=cm.dataset.cmode;LS.set('fu-cmode',cMode);tradePage(true);return}
  const cr=t.closest('[data-crange]');if(cr){cRange=cr.dataset.crange;tradePage(true);return}
});
addEventListener('popstate',()=>popPage());
$('#tq').addEventListener('input',e=>{tq=e.target.value;shown=24;if(D)rows(D)});
$('#tsort').addEventListener('change',e=>{tsort=e.target.value;LS.set('fu-tsort',tsort);if(D)rows(D)});
if(pushOK)navigator.serviceWorker.addEventListener('message',e=>{const u=e.data&&e.data.open;if(!u)return;const id=new URL(u,location.origin).searchParams.get('bot');if(id&&D&&D.bots.some(b=>b.id===id))openTrader(id)});
pushRefresh().then(()=>{if(pushSub)pushSave().catch(()=>{})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#notif').hidden)$('#notif').hidden=true;else if(pages.length)history.back()}});
setInterval(()=>{if(!lastFetch)return;const s=Math.round((Date.now()-lastFetch)/1000);let t=`Обновено преди ${s} с`;
  if(D&&D.dataT&&(D.status==='open'||D.status==='premarket')){const a=Math.max(0,Math.round((Date.now()-D.dataT)/1000));t+=` · цените са отпреди ${a<120?a+' с':Math.round(a/60)+' мин'} · ${D.srcLive==='yahoo+finnhub'?'Yahoo + Finnhub':'Yahoo'}`}
  $('#upd').textContent=t},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
addEventListener('resize',()=>{if(D){homeDrawn=true;render()}});
load();setInterval(()=>{if(!document.hidden)load()},10000);
/* нова версия → приложението се обновява само (иначе отворената страница остава стара) */
const MYVER=(document.querySelector('meta[name=fu-ver]')||{}).content;
async function checkVer(){try{const r=await fetch('/?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/name="fu-ver" content="([^"]+)"/);if(m&&MYVER&&m[1]!==MYVER&&!pages.length)location.reload()}catch(e){}}
setInterval(()=>{if(!document.hidden)checkVer()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVer()});
})();
</script>
<!-- PWA: бутон „Инсталирай“ + упътване за iPhone + „Отвори в Chrome“ от Viber/Messenger/Instagram -->
<style>
.pwa-bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--pwa-offset,16px) + env(safe-area-inset-bottom,0px));z-index:40;max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-family:inherit}
.pwa-bar img{width:34px;height:34px;border-radius:9px;flex:none}
.pwa-bar .t{flex:1;min-width:0;font-size:14px;line-height:1.3}
.pwa-bar .t b{display:block;font-size:15px}
.pwa-bar button{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:11px;padding:10px 14px;cursor:pointer;flex:none}
.pwa-bar .go{background:var(--accent);color:var(--accent-ink)}
.pwa-bar .x{background:transparent;color:var(--bg);opacity:.7;padding:10px 8px;font-size:18px;line-height:1}
.pwa-sheet{position:fixed;inset:0;z-index:41;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.pwa-sheet .box{background:var(--surface);color:var(--ink);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;font-family:inherit}
.pwa-sheet h3{margin:0;font-size:20px}
.pwa-sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.45}
.pwa-sheet .ic{display:inline-flex;vertical-align:middle;width:22px;height:22px;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:6px;margin:0 2px}
.pwa-sheet .ic svg{width:15px;height:15px}
.pwa-sheet .close{font:inherit;font-weight:800;border:0;border-radius:12px;padding:13px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.pwa-sheet .url{font-size:13px;word-break:break-all;background:var(--bg);border-radius:10px;padding:8px 10px;user-select:all}
</style>
<script>
(function(){
  var NAME=document.title||'приложението';
  var ua=navigator.userAgent||'';
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.getRegistration().then(function(r){if(!r)navigator.serviceWorker.register('/sw.js').catch(function(){})})});
  if(standalone)return;
  var KEY='pwa-dismissed';
  try{var d=+localStorage.getItem(KEY)||0;if(Date.now()-d<3*86400e3)return}catch(e){}
  var isAndroid=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  var inApp=/FBAN|FBAV|FB_IAB|Instagram|Viber|Line\/|MicroMessenger|Messenger|TikTok|Snapchat|; wv\)/i.test(ua);
  var iosNotSafari=isIOS&&/CriOS|FxiOS|EdgiOS/i.test(ua);
  var deferred=null,bar=null;
  var icon=(document.querySelector('link[rel="apple-touch-icon"]')||{}).href||'';
  var SHARE='<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v8h14v-8"/></svg></span>';
  var DOTS='<span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>';
  function dismiss(){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}if(bar){bar.remove();bar=null}}
  function showBar(title,sub,btn,onGo){
    if(bar)bar.remove();bar=document.createElement('div');bar.className='pwa-bar';bar.setAttribute('role','region');bar.setAttribute('aria-label','Инсталиране');
    bar.innerHTML=(icon?'<img alt="" src="'+icon+'">':'')+'<div class="t"><b></b><span></span></div><button type="button" class="go"></button><button type="button" class="x" aria-label="Скрий">×</button>';
    bar.querySelector('b').textContent=title;bar.querySelector('.t span').textContent=sub;bar.querySelector('.go').textContent=btn;
    bar.querySelector('.go').onclick=onGo;bar.querySelector('.x').onclick=dismiss;
    document.body.appendChild(bar);
  }
  function sheet(html){
    var s=document.createElement('div');s.className='pwa-sheet';s.innerHTML='<div class="box" role="dialog" aria-modal="true">'+html+'<button type="button" class="close">Разбрах</button></div>';
    s.onclick=function(e){if(e.target===s||e.target.classList.contains('close'))s.remove()};document.body.appendChild(s);
  }
  function androidSteps(){sheet('<h3>Сложи '+NAME+' на началния екран</h3><ol><li>Натисни '+DOTS+' горе вдясно в Chrome.</li><li>Избери <b>„Добави към началния екран“</b> (или „Инсталиране на приложение“).</li><li>Ако пита, избери <b>„Създаване на пряк път“</b> и натисни <b>„Добави“</b>.</li></ol><p style="margin:0;font-size:14px;opacity:.75">Не натискай стрелката ⬇ в менюто: тя само изтегля страницата.</p>')}
  function iosSteps(){sheet('<h3>Сложи '+NAME+' на началния екран</h3><ol><li>Натисни '+SHARE+' <b>„Сподели“</b> долу (или горе) в Safari.</li><li>Превърти надолу и избери <b>„Добави към началния екран“</b>.</li><li>Натисни <b>„Добави“</b> горе вдясно.</li></ol>')}
  function openInBrowser(){
    if(isAndroid){var u=location.href.replace(/^https?:\/\//,'');location.href='intent://'+u+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';
      setTimeout(function(){sheet('<h3>Отвори в Chrome</h3><ol><li>Натисни '+DOTS+' горе вдясно.</li><li>Избери <b>„Отвори в Chrome“</b> или „Отвори в браузър“.</li></ol><div class="url">'+location.href+'</div>')},1500)}
    else sheet('<h3>Отвори в Safari</h3><ol><li>Натисни '+DOTS+' или иконката с компас.</li><li>Избери <b>„Отвори в Safari“</b>.</li><li>После '+SHARE+' → <b>„Добави към началния екран“</b>.</li></ol><div class="url">'+location.href+'</div>');
  }
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;
    showBar('Инсталирай '+NAME,'Иконка на началния екран, отваря се като приложение','Инсталирай',function(){deferred.prompt();deferred.userChoice.then(function(c){if(c&&c.outcome==='accepted'&&bar){bar.remove();bar=null}else androidSteps();deferred=null})})});
  addEventListener('appinstalled',function(){if(bar){bar.remove();bar=null}});
  setTimeout(function(){
    if(deferred||bar)return;
    if(inApp)showBar('Отвори в '+(isIOS?'Safari':'Chrome'),'От тук не може да се инсталира','Отвори',openInBrowser);
    else if(isIOS)showBar('Сложи '+NAME+' на телефона','Отваря се като истинско приложение','Как?',function(){iosNotSafari?sheet('<h3>Отвори в Safari</h3><ol><li>Копирай адреса и го отвори в <b>Safari</b>.</li><li>После '+SHARE+' → <b>„Добави към началния екран“</b>.</li></ol><div class="url">'+location.href+'</div>'):iosSteps()});
    else if(isAndroid)showBar('Сложи '+NAME+' на телефона','Иконка на началния екран','Как?',androidSteps);
  },2800);
})();
</script>
