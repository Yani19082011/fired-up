<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fired Up · Деск</title>
<meta name="fu-ver" content="45">
<meta name="theme-color" content="#F5F6F8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fired Up">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap">
<style>
/* Дизайн 2 „Светъл и чист“: бял фон, бели карти със сянка, зелено за печалба, червено за загуба (Manrope). */
:root{
  --pwa-offset:92px;
  --bg:#F5F6F8; --surface:#FFFFFF; --raise:#F0F1F4; --line:#E5E7EB; --line2:#EEF0F3; --ink:#0E1116; --muted:#6B7280; --dim:#9CA3AF;
  --accent:#0E1116; --accent-ink:#FFFFFF; --up:#00A35C; --down:#E5484D; --blue:#2F5BEA; --gold:#D99A00;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(245,246,248,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.logo i svg{width:17px;height:17px}
.logo small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px}
.pill{margin-left:auto;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:800;border-radius:999px;padding:5px 10px;background:var(--raise);color:var(--muted);white-space:nowrap}
.pill.live{background:#E3F7EC;color:var(--up)}
.icb{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icb svg{width:20px;height:20px}
.icb b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--down);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.tape{overflow:hidden;height:28px;position:relative;background:var(--surface);border-block:1px solid var(--line)}
.tape .run{position:absolute;display:flex;gap:22px;white-space:nowrap;height:100%;align-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;animation:tape 40s linear infinite;padding-left:10px}
@keyframes tape{to{transform:translateX(-50%)}}
main{padding-bottom:110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px}
.acct{margin-top:12px;padding:16px}
.acct .lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.acct .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.acct .sub{font-size:14px;font-weight:700;margin-top:2px}
.acct .sub span{color:var(--muted);font-weight:600}
canvas.chart{width:100%;display:block;touch-action:pan-y}
.tfs{display:flex;gap:4px;margin-top:10px;background:var(--raise);border-radius:12px;padding:3px}
.tfs button{flex:1;border:0;background:none;padding:7px 0;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:9px}
.tfs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:11px 13px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-size:19px;font-weight:800;letter-spacing:-.02em}
.tile .v small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.h b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.h span,.h button{font-size:12.5px;color:var(--muted);font-weight:700;background:none;border:0;padding:0}
.h button{color:var(--blue)}
/* екипът */
.team{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 6px}
.team::-webkit-scrollbar{display:none}
.ag{flex:none;width:200px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:11px 12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.ag .t{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--c);color:#fff}
.ag .t b{font-size:13.5px;line-height:1.1}.ag .t small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ag p{margin:0;font-size:12.5px;color:#374151;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:54px}
/* идеи и позиции */
.list{display:flex;flex-direction:column;gap:10px}
.idea{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;width:100%;text-align:left}
.sym{width:60px;height:46px;border-radius:12px;background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:none;letter-spacing:.02em;border-left:3px solid var(--c)}
.sym small{font-size:8.5px;font-weight:800;letter-spacing:.06em;color:var(--c)}
.idea .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.idea .m b{font-size:14.5px}
.idea .m span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.chip{font-size:11px;font-weight:800;letter-spacing:.04em;border-radius:8px;padding:3px 8px;color:#fff;background:var(--c);white-space:nowrap}
.chip.o{background:none;color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.pos{background:var(--surface);border:1px solid rgba(47,91,234,.35);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.pos .a{display:flex;align-items:center;gap:10px}
.pos .a .m{flex:1;min-width:0}
.pos .a .m b{font-size:15px}.pos .a .m span{display:block;font-size:12.5px;color:var(--muted)}
.pos .pl{font-size:18px;font-weight:800;text-align:right}.pos .pl small{display:block;font-size:12px;font-weight:700}
.meter{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down) 0%,#D1D5DB 33%,#D1D5DB 55%,var(--up) 100%)}
.meter i{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.ml{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}
/* чат */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:none;border:0;padding:0}
.msg .bub{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;box-shadow:var(--shadow);padding:9px 12px}
.msg .bub .w{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--c)}
.msg .bub .w time{color:var(--dim);font-family:var(--mono);font-weight:700;font-size:11px}
.msg .bub p{margin:3px 0 0;font-size:14px;line-height:1.45}
.msg.chief .bub{border-color:rgba(14,17,22,.25)}
.msg.skeptic .bub{background:#FFF7F7;border-color:rgba(229,72,77,.25)}
.filt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 14px}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:800;color:var(--muted)}
.filt button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* сделки */
.tr{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;width:100%;text-align:left}
.bs{display:flex;align-items:center;gap:4px;flex:none}.bs i{width:22px;height:22px;border-radius:7px;color:#fff;font-style:normal;font-weight:900;font-size:10.5px;display:grid;place-items:center}.bs em{width:8px;height:2px;background:var(--line)}
.tr .m{flex:1;min-width:0}.tr .m b{font-size:14.5px}.tr .m span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .p{text-align:right;font-weight:800;font-size:15px}.tr .p small{display:block;font-size:12px}
/* екип (раздел) */
.agc{display:flex;flex-direction:column;gap:10px}
.agc .hd{display:flex;align-items:center;gap:10px}.agc .hd .av{width:40px;height:40px;font-size:20px;border-radius:13px}
.agc .hd b{font-size:16px}.agc .hd small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.agc p{margin:0;font-size:13.5px;color:#374151}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv span{background:var(--raise);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.kv small{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.05em}
.kv b{font-size:16px}
.health{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.health div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2);padding:6px 0}
/* страница на идея */
.page{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
.page .wrap{padding-bottom:60px}
.ph{display:flex;align-items:center;gap:12px;padding:12px 0 6px;position:sticky;top:0;background:var(--bg);z-index:2}
.back{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px}
.ph .t{flex:1;min-width:0}.ph .t b{font-size:21px;font-weight:800;display:block;line-height:1.1}.ph .t span{font-size:12.5px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:4px;background:var(--raise);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.step{display:flex;gap:10px;align-items:flex-start}
.step .bub{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;box-shadow:var(--shadow);padding:10px 12px}
.step .bub .w{font-size:12px;font-weight:800;color:var(--c);display:flex;justify-content:space-between;gap:8px}
.step .bub p{margin:4px 0 0;font-size:14px}
.step ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.step .ai{margin-top:8px;padding:8px 10px;border-radius:10px;background:#F4F1FF;font-size:13.5px}
.step .ai small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#6D4AFF}
.conv{height:8px;border-radius:4px;background:var(--raise);overflow:hidden;margin-top:8px}.conv i{display:block;height:100%;border-radius:4px}
.news a{display:block;font-size:13px;line-height:1.35;text-decoration:none;color:var(--ink);padding:6px 0;border-top:1px solid var(--line2)}
.news a small{display:block;color:var(--muted);font-size:11.5px}
/* известия */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(14,17,22,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet .bx{background:var(--bg);width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--dim);padding:4px 10px;min-width:64px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:800}
.upd{text-align:center;font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:22px}
.note{font-size:13px;color:#374151}.note li{margin-bottom:6px}
.setup{margin-top:14px;background:#FFF7E6;border:1px solid #F5D48A;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="logo"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF5A1F" d="M12 1.5c1.1 3.9 5.6 6.2 5.6 11.6A5.6 5.6 0 0 1 6.4 13c0-2.3.9-3.9 2.3-5.1.2 1.8 1.2 2.9 2.3 3.4 0-3.4.3-6.9 1-9.8z"/></svg></i>Fired Up <small>деск</small></div>
    <span class="pill" id="pill">…</span>
    <button class="icb" id="bell" type="button" aria-label="Известия"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b id="bellN" hidden></b></button>
  </div>
  <div class="tape" id="tape" hidden><div class="run" id="tapeRun"></div></div>
</header>

<main><div class="wrap" id="main">
  <div class="setup" id="setup" hidden></div>
  <section id="v-home">
    <div class="card acct">
      <span class="lbl" id="aLbl">Сметката на деска</span>
      <div class="big num" id="aPct">—</div>
      <div class="sub num" id="aVal">—</div>
      <canvas class="chart" id="homeChart" style="height:170px;margin-top:12px" aria-label="Графика на сметката"></canvas>
      <div class="tfs" id="htf"><button type="button" data-tf="1h">1Ч</button><button type="button" data-tf="1d">1Д</button><button type="button" data-tf="1w">1С</button><button type="button" data-tf="all">Всичко</button></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="h"><b>Екипът сега</b><button type="button" data-go="team">Кой какво прави ›</button></div>
    <div class="team" id="team"></div>
    <div class="h"><b>Отворени сделки</b><span id="posN"></span></div>
    <div class="list" id="posList"></div>
    <div class="h"><b>Последни решения</b><button type="button" data-go="desk">Масата ›</button></div>
    <div class="list" id="ideaList"></div>
  </section>
  <section id="v-desk" hidden>
    <div class="h" style="margin-top:14px"><b style="font-size:21px">Масата</b><span>как спори екипът</span></div>
    <div class="filt" id="chatF"></div>
    <div class="chat" id="chat"></div>
  </section>
  <section id="v-trades" hidden>
    <div class="h" style="margin-top:14px"><b style="font-size:21px">Сделки</b><span id="trN"></span></div>
    <div class="tiles" id="trTiles" style="margin-top:0"></div>
    <div class="filt" id="trF" style="margin-top:14px"><button type="button" data-tf2="trades">Сделки</button><button type="button" data-tf2="ideas">Всички идеи</button><button type="button" data-tf2="skip">Пропуснати</button></div>
    <div class="list" id="trList"></div>
  </section>
  <section id="v-team" hidden>
    <div class="h" style="margin-top:14px"><b style="font-size:21px">Екипът</b><span>шестима, една сметка</span></div>
    <div class="list" id="teamList"></div>
  </section>
  <div class="upd" id="upd"></div>
</div></main>

<nav class="tabs" aria-label="Раздели"><div class="in" role="tablist" id="tabs">
  <button role="tab" type="button" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Деск</button>
  <button role="tab" type="button" data-v="desk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Масата</button>
  <button role="tab" type="button" data-v="trades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Сделки</button>
  <button role="tab" type="button" data-v="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Екипът</button>
</div></nav>

<div class="page" id="pIdea" hidden role="dialog" aria-modal="true" aria-label="Идея"></div>
<div class="sheet" id="notif" hidden><div class="bx" role="dialog" aria-modal="true" aria-label="Известия" id="notifBox"></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let D=null,tab=LS.get('fd-tab','home'),hTf=LS.get('fd-htf','1d'),chatF='all',trF='trades',lastFetch=0,pages=[];
let ideaId=null,IDEA=null,cMode=LS.get('fd-cmode','candle'),cRange='near',notifSeen=+LS.get('fd-notif',0)||0;
let openFromUrl=new URLSearchParams(location.search).get('idea');if(openFromUrl)history.replaceState(null,'','/');
if(!['home','desk','trades','team'].includes(tab))tab='home';

const money=(n,sign)=>{const a=Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'−$':(sign&&n>0?'+$':'$'))+a};

function popPage(){const id=pages.pop();if(!id)return;$(id).hidden=true;if(id==='#pIdea'){ideaId=null;IDEA=null}if(!pages.length)document.body.style.overflow=''}

      ${step('sentiment',`<p>${esc(I.sentTxt)}</p>`)}
      ${step('chart',`<p>${esc(I.chartTxt)}</p>${c?`<p class="mut" style="font-size:12.5px">Цена ${px(c.px)} · средна за деня (VWAP) ${px(c.vwap)} · RSI ${c.rsi}</p>`:''}`)}
      ${step('skeptic',`<p><b style="color:${(VERD[sk.verdict]||['','#6B7280'])[1]}">${sk.verdict==='BUY'&&dn?'ЗАЛОЖИ НА СПАД':(VERD[sk.verdict]||['—'])[0]}</b></p>${objs.length?`<ul>${objs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:'<p>Търсих причина да не купуваме и не намерих сериозна.</p>'}${I.ai&&I.ai.skeptic?`<div class="ai"><small>AI СКЕПТИК</small>${esc(I.ai.skeptic)}</div>`:''}`)}
      ${step('chief',`<p><span class="chip" style="--c:${v[1]}">${v[0]}</span> ${esc(ch.why||'')}</p>${I.ai&&I.ai.chief?`<div class="ai"><small>AI ШЕФ</small>${esc(I.ai.chief)}</div>`:''}<div class="conv"><i style="width:${convP}%;background:${convP>=50?'#00A35C':convP>=30?'#D99A00':'#E5484D'}"></i></div><p class="mut" style="font-size:12px">Увереност ${String(ch.conv??'—').replace('.',',')} от 5${ch.verdict==='BUY'?` · ${Math.round((ch.sizePct||0)*100)}% от сметката`:''}</p>${log.length&&I.log.length>1?`<ul class="mut">${log}</ul>`:''}`)}
    </div>
    <div class="h"><b>Какво стана после</b></div>
    <div class="chat">${(I.feed||[]).slice().reverse().map(msgRow).join('')||'<div class="empty">—</div>'}</div>
  </div>`;
  pg.scrollTop=keep;
  const cv=$('#iChart');const o={entry:tr?tr.entry:pos?pos.entry:c&&c.entry,stop:tr?tr.stop0:pos?pos.stop:c&&c.stop,tp:tr?tr.target:pos?pos.target:c&&c.target,from:I.t-40*60000,to:tr?tr.out+20*60000:null,signal:I.t,
    marks:[...(tr?[{t:tr.in,p:tr.entry,k:BSK(tr.dir||1)[0]},{t:tr.out,p:tr.exit,k:BSK(tr.dir||1)[1]}]:[]),...(pos?[{t:pos.t,p:pos.entry,k:BSK(pos.dir||1)[0]}]:[])]};
  const sym=I.sym;const cd=chartCache[sym]&&chartCache[sym].d;candles(cv,cd||false,o);
  getChart(sym).then(d=>{if(ideaId!==I.id)return;const draw=hx=>candles(cv,d,o,hx);draw(null);scrub(cv,draw)});
}

/* ——— известия ——— */
function notifItems(d){return d.feed.filter(e=>e.a==='chief'&&/^(КУПУВАМЕ|ЗАЛАГАМЕ|ЧАКАМЕ|ПРОПУСКАМЕ|Купихме|Заложихме|Продадохме|Затворихме|Декът|Днес|Денят|Борсата|🔥)/.test(e.x))}
function bell(d){const n=notifItems(d).filter(e=>e.t>notifSeen).length;$('#bellN').hidden=!n;$('#bellN').textContent=n>9?'9+':n}
const pushOK=('serviceWorker' in navigator)&&('PushManager' in window)&&('Notification' in window);
const PDEF={buy:true,sell:true,wait:true,skip:true,summary:true};
let pushSub=null,pushPrefs={...PDEF,...JSON.parse(LS.get('fd-pprefs','{}')||'{}')},pushBusy=false,pushMsg='';
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64u(u){const p='='.repeat((4-u.length%4)%4);const b=atob((u+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function swReg(){let r=await navigator.serviceWorker.getRegistration();if(!r)r=await navigator.serviceWorker.register('/sw.js');return navigator.serviceWorker.ready}
async function pushRefresh(){if(!pushOK)return;try{const r=await swReg();pushSub=await r.pushManager.getSubscription()}catch(e){}}
async function pushSave(action){if(!pushSub)return;LS.set('fd-pprefs',JSON.stringify(pushPrefs));
  const r=await fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:action||'prefs',sub:pushSub.toJSON(),prefs:{...pushPrefs,favOnly:false}})});if(!r.ok)throw new Error('server')}
async function pushEnable(){pushBusy=true;renderNotif();try{
  const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error(perm==='denied'?'denied':'skip');
  const k=await (await fetch('/api/push')).json();if(!k.key)throw new Error('key');
  const r=await swReg();pushSub=await r.pushManager.getSubscription()||await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)});
  await pushSave('test');pushMsg='Готово! Трябва да ти дойде пробно известие.'}
  catch(e){pushMsg=e.message==='denied'?'Известията са забранени. Разреши ги от настройките на телефона за този сайт и опитай пак.':e.message==='skip'?'Не разреши известията. Натисни пак, за да опиташ.':'Не стана: '+e.message}
  pushBusy=false;renderNotif()}
async function pushDisable(){try{if(pushSub){await fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'unsubscribe',sub:pushSub.toJSON()})});await pushSub.unsubscribe()}}catch(e){}pushSub=null;pushMsg='Известията са изключени.';renderNotif()}
function pushBox(){
  if(!pushOK)return `<div class="card" style="margin:6px 0 12px;font-size:13.5px">${isIOS&&!standalone?'На iPhone известията работят само ако приложението е добавено на началния екран: натисни <b>Сподели</b> → <b>„Добави към началния екран“</b> и го отвори от иконката.':'Този браузър не поддържа известия. Отвори приложението в Chrome.'}</div>`;
  if(!pushSub)return `<div class="card" style="margin:6px 0 12px;display:flex;flex-direction:column;gap:10px"><b>Известия на телефона</b><span class="mut" style="font-size:13px">Всяко решение на деска — КУПИ, ЧАКАЙ, ПРОПУСНИ — и всяка продажба с процента, плюс обобщение в края на деня. Идват дори когато приложението е затворено.</span>
    <button type="button" id="pushOn" ${pushBusy?'disabled':''} style="height:46px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:14px">${pushBusy?'Включвам…':'🔔 Включи известията'}</button>${pushMsg?`<span style="font-size:12.5px;color:#D99A00">${esc(pushMsg)}</span>`:''}</div>`;
  const row=(k,l,sub)=>`<label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer"><span style="flex:1"><b style="font-size:14px">${l}</b>${sub?`<span class="mut" style="display:block;font-size:12px">${sub}</span>`:''}</span><input type="checkbox" data-pp="${k}" ${pushPrefs[k]?'checked':''} style="width:22px;height:22px;accent-color:#00A35C"></label>`;
  return `<div class="card" style="margin:6px 0 12px"><b>Известия на телефона · включени ✓</b>
    ${row('buy','🟢 Влязохме (покупка или залог на спад)','„КУПИХМЕ ABCD…“ или „ЗАЛОЖИХМЕ НА СПАД: GOLD…“')}${row('sell','🔴🟢 Излязохме','с процента и сумата')}${row('wait','⏳ Чакаме','когато Скептикът каже „чакай“')}${row('skip','⛔ Пропускаме','когато Скептикът спре идея')}${row('summary','📊 Обобщение в края на деня','')}
    <span style="display:flex;gap:8px;margin-top:10px"><button type="button" id="pushTest" style="flex:1;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--raise);font-weight:800">Пробно известие</button><button type="button" id="pushOff" style="height:40px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:none;color:var(--muted);font-weight:800">Изключи</button></span>${pushMsg?`<span style="display:block;font-size:12.5px;color:#D99A00;margin-top:8px">${esc(pushMsg)}</span>`:''}</div>`;
}
function renderNotif(){const it=notifItems(D||{feed:[]});$('#notifBox').innerHTML=`<div class="grab"></div><b style="font-size:17px">Известия</b>`+pushBox()+`<div class="chat">${it.slice(0,60).map(msgRow).join('')||'<div class="empty">Още няма решения.</div>'}</div>`}
$('#bell').onclick=async()=>{pushMsg='';await pushRefresh();renderNotif();$('#notif').hidden=false;const it=notifItems(D||{feed:[]});if(it[0]){notifSeen=it[0].t;LS.set('fd-notif',notifSeen)}if(D)bell(D)};
$('#notifBox').addEventListener('click',e=>{if(e.target.closest('#pushOn'))pushEnable();else if(e.target.closest('#pushOff'))pushDisable();else if(e.target.closest('#pushTest')){pushMsg='Изпратено — ще дойде след секунди.';pushSave('test').catch(()=>{pushMsg='Не стана.'}).then(renderNotif)}});
$('#notifBox').addEventListener('change',e=>{const c=e.target.closest('[data-pp]');if(!c)return;pushPrefs[c.dataset.pp]=c.checked;pushSave().catch(()=>{})});
$('#notif').onclick=e=>{if(e.target.id==='notif'||e.target.classList.contains('grab'))$('#notif').hidden=true};

/* ——— навигация ——— */
function setTab(t){tab=t;LS.set('fd-tab',tab);if(D)render();scrollTo({top:0})}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.v)};
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('#notifBox'))return;
  const go=t.closest('[data-go]');if(go){setTab(go.dataset.go);return}
  const ag=t.closest('[data-agent]');if(ag){chatF=ag.dataset.agent;setTab('desk');return}
  const id=t.closest('[data-idea]');if(id&&!t.closest('#pIdea .chat a')){if(ideaId===id.dataset.idea)return;if(ideaId){ideaId=id.dataset.idea;IDEA=null;ideaPage(false);loadIdea(ideaId).then(ok=>{if(ok)ideaPage(false)});return}openIdea(id.dataset.idea);return}
  const tf=t.closest('#htf button');if(tf){hTf=tf.dataset.tf;LS.set('fd-htf',hTf);if(D)home(D);return}
  const cf=t.closest('[data-cf]');if(cf){chatF=cf.dataset.cf;if(D)desk(D);return}
  const t2=t.closest('[data-tf2]');if(t2){trF=t2.dataset.tf2;if(D)trades(D);return}
  const cl=t.closest('[data-close]');if(cl){history.back();return}
  const cm=t.closest('[data-cmode]');if(cm){cMode=cm.dataset.cmode;LS.set('fd-cmode',cMode);ideaPage(false);return}
  const cr=t.closest('[data-crange]');if(cr){cRange=cr.dataset.crange;ideaPage(false);return}
});
addEventListener('popstate',()=>popPage());
if(pushOK)navigator.serviceWorker.addEventListener('message',e=>{const u=e.data&&e.data.open;if(!u)return;const id=new URL(u,location.origin).searchParams.get('idea');if(id)openIdea(id)});
pushRefresh().then(()=>{if(pushSub)pushSave().catch(()=>{})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#notif').hidden)$('#notif').hidden=true;else if(pages.length)history.back()}});
setInterval(()=>{if(!lastFetch||!D)return;const s=Math.round((Date.now()-lastFetch)/1000);let t=`Обновено преди ${s} с`;
  if(D.dataT){const a=Math.max(0,Math.round((Date.now()-D.dataT)/1000));t+=` · цените са отпреди ${a<120?a+' с':Math.round(a/60)+' мин'}`}
  if(D.src)t+=` · акции: ${D.src.stock}, крипто: ${D.src.crypto}`;$('#upd').textContent=t},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
addEventListener('resize',()=>{if(D)render()});
load();setInterval(()=>{if(!document.hidden)load()},10000);
const MYVER=(document.querySelector('meta[name=fu-ver]')||{}).content;
async function checkVer(){try{const r=await fetch('/?v='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/name="fu-ver" content="([^"]+)"/);if(m&&MYVER&&m[1]!==MYVER&&!pages.length)location.reload()}catch(e){}}
setInterval(()=>{if(!document.hidden)checkVer()},60000);
})();
</script>
</body>
